<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Samuel Andrianirina">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d92672"/>
      <stop offset="1" stop-color="#f38038"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.28" cy="0.22" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded brand tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#brand)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#shine)"/>

  <!-- Monogram S -->
  <text x="32" y="34" text-anchor="middle" dominant-baseline="central"
        font-family="'Space Grotesk', 'Segoe UI', Arial, sans-serif"
        font-size="42" font-weight="800" fill="#ffffff">S</text>

  <!-- Developer bracket accents -->
  <path d="M15 24 L11 32 L15 40" fill="none" stroke="#ffffff" stroke-opacity="0.55"
        stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M49 24 L53 32 L49 40" fill="none" stroke="#ffffff" stroke-opacity="0.55"
        stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
